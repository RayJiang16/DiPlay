name: Build local-only standalone APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify local-only source
        run: |
          python3 scripts/check_public_tree.py
          python3 scripts/check_local_only.py
      - name: Tests and source-only lint
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug --stacktrace
      - name: Provision existing experimental CarPlay identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.2.12 --repo carlito12345/DiPlay --pattern DiPlay-0.2.12.apk --dir "$RUNNER_TEMP/reference"
          echo "94d1490f2b786a716a0ed7237bbf2f0729af072ff6300ae0084bb714a84fcc2f  $RUNNER_TEMP/reference/DiPlay-0.2.12.apk" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/auth/offline-mfi"
          unzip -p "$RUNNER_TEMP/reference/DiPlay-0.2.12.apk" assets/offline-mfi/identity.pk8 > "$RUNNER_TEMP/auth/offline-mfi/identity.pk8"
          unzip -p "$RUNNER_TEMP/reference/DiPlay-0.2.12.apk" assets/offline-mfi/certificate.p7b > "$RUNNER_TEMP/auth/offline-mfi/certificate.p7b"
      - name: Build standalone local-only APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/auth
        run: ./gradlew :mobile:assembleStandaloneDebug --stacktrace
      - name: Check APK for removed cloud endpoints
        run: python3 scripts/check_local_only.py mobile/build/outputs/apk/debug/mobile-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-0.2.12-local
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
